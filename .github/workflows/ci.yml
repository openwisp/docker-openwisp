---
name: CI Build (Docker-OpenWISP)

on:
  push:
    branches:
      - master
      - "[0-9]+.[0-9]+"
  pull_request:
    branches:
      - master
      - "[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: CI Build
    runs-on: ubuntu-24.04
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup testing environment
        id: deps
        run: |
          sudo curl -sL -o /bin/hadolint "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64"
          sudo chmod +x /bin/hadolint
          sudo curl -sL -o /usr/local/bin/shfmt "https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64"
          sudo chmod +x /usr/local/bin/shfmt
          echo "127.0.0.1 dashboard.openwisp.org api.openwisp.org" | sudo tee -a /etc/hosts
          # The auto-install script uses production mode, so disable metrics explicitly.
          printf '\nMETRIC_COLLECTION=False\n' >> .env
          # ERROR: Cannot uninstall urllib3 2.0.7, RECORD file not found. Hint: The package was installed by debian.
          sudo apt remove python3-urllib3 python3-typing-extensions python3-packaging
          sudo pip3 install -r requirements-test.txt
          sudo npm install -g prettier

      - name: QA checks
        run: ./run-qa-checks

      - name: Use the auto-install script to start containers with edge images
        id: auto_install_edge
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        run: |
          printf "edge\n./.env\n" | sudo -E ./deploy/auto-install.sh \
              || (docker compose --file /opt/openwisp/docker-openwisp/docker-compose.yml logs && exit 1)

      - name: Build Images
        id: build_images
        if: ${{ !cancelled() && steps.auto_install_edge.conclusion == 'success' }}
        run: make compose-build nfs-build

      - name: Set GIT_BRANCH
        id: set_git_branch
        if: ${{ !cancelled() && steps.build_images.conclusion == 'success' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" == "pull_request" ]; then
            GIT_BRANCH="$HEAD_REF"
            GIT_PATH="https://github.com/$HEAD_REPO.git"
          else
            GIT_BRANCH="$REF_NAME"
            GIT_PATH=""
          fi
          echo "GIT_PATH=$GIT_PATH" >> "$GITHUB_ENV"
          echo "GIT_BRANCH=$GIT_BRANCH" >> "$GITHUB_ENV"

      - name: Use auto-install script to upgrade containers to latest version
        id: auto_install_upgrade
        if: ${{ !cancelled() && steps.set_git_branch.conclusion == 'success' }}
        # Do not remove the blank lines from the input.
        run: |
          printf "edge\n" | \
            GIT_BRANCH="${GIT_BRANCH}" SKIP_PULL=true sudo -E ./deploy/auto-install.sh --upgrade \
            || (cat /opt/openwisp/autoinstall.log && exit 1)

      - name: Enable development profile for tests
        id: enable_development_profile
        if: ${{ !cancelled() && steps.auto_install_upgrade.conclusion == 'success' }}
        run: |
          sudo sed -i 's/DEV_MODE=False/DEV_MODE=True/' /opt/openwisp/docker-openwisp/.env
          docker compose --file /opt/openwisp/docker-openwisp/docker-compose.yml up --detach --force-recreate

      # The test suite needs to create files during execution. Because the deploy
      # script runs with `sudo`, the installation directory ends up owned by root,
      # making it inaccessible to the unprivileged CI user. This step fixes the
      # ownership so the test suite can write the required files.
      - name: Fix permissions for CI user
        if: ${{ !cancelled() && steps.enable_development_profile.conclusion == 'success' }}
        run: |
          sudo chown -R "$USER:$USER" /opt/openwisp

      - name: Test
        if: ${{ !cancelled() && steps.enable_development_profile.conclusion == 'success' }}
        uses: openwisp/openwisp-actions/.github/actions/retry-command@61f8fad5c4f6b9b1cf47eb396c2e1c8392aed52f # 0.1.1
        with:
          delay_seconds: 30
          max_attempts: 5
          # The auto-install script installs docker-openwisp by default in
          # /opt/openwisp/docker-openwisp. To ensure the test runs correctly
          # and environment variables remain intact, it is essential to
          # execute the test from this directory.
          # The containers are already running, so use the target that only
          # executes Python tests without restarting or stopping the stack.
          command: cd /opt/openwisp/docker-openwisp && make develop-pythontests
        env:
          SELENIUM_HEADLESS: 1

      - name: Docker compose failure diagnostics
        if: ${{ failure() && steps.auto_install_upgrade.conclusion == 'success' }}
        run: |
          bash .github/scripts/docker-compose-failure-diagnostics.sh
          # Intentionally fail so CI highlights this step and directs maintainers
          # and developers to the logs needed for debugging.
          exit 1
        working-directory: /opt/openwisp/docker-openwisp

      - name: Stop containers
        # Run teardown exactly once after the retry loop, regardless of the
        # test outcome. Keeping `make stop` out of the retried command ensures
        # a failed attempt never skips teardown and never tears the stack down
        # between retries (which would make every subsequent retry fail).
        if: ${{ always() && steps.auto_install_upgrade.conclusion == 'success' }}
        run: cd /opt/openwisp/docker-openwisp && make stop

      # the following action is equivalent to
      # echo "$DOCKER_HUB_SECRET" | docker login --username "$DOCKER_HUB_USERNAME" --password-stdin
      - name: Login to Docker Hub
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_SECRET }}

      # Skip image builds and tests since they were already done
      - name: Publish to Docker Hub
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          make publish TAG=edge SKIP_BUILD=true SKIP_TESTS=true
        env:
          SELENIUM_HEADLESS: 1

      - name: Login to GitLab Container Registry
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_DOCKER_REGISTRY_USER }}
          password: ${{ secrets.GITLAB_DOCKER_REGISTRY_TOKEN }}

      # Skip image builds and tests since they were already done
      - name: Publish to GitLab Container Registry
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          make publish IMAGE_PREFIX=registry.gitlab.com/openwisp/docker-openwisp TAG=edge SKIP_BUILD=true SKIP_TESTS=true
