name: CI Failure Bot

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Privileged analysis follows failed PR CI and treats PR code and logs as data only.
    workflows: ["CI Build (Docker-OpenWISP)"]
    types:
      - completed

permissions: {}

concurrency:
  group: ci-failure-${{ github.repository }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  find-pr:
    name: Find failed CI pull request
    runs-on: ubuntu-latest
    if: >
      github.repository == 'openwisp/docker-openwisp' &&
      github.event.workflow_run.name == 'CI Build (Docker-OpenWISP)' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    permissions:
      pull-requests: read # Locates the pull request associated with the failed workflow run.
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      pr_author: ${{ steps.pr.outputs.author }}
    steps:
      - name: Find PR Number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER_PAYLOAD: ${{ github.event.workflow_run.pull_requests[0].number }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          EVENT_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          emit_pr() {
            local pr_number="$1"
            local pr_author
            pr_author=$(gh pr view "$pr_number" --repo "$REPO" --json author --jq '.author.login // empty' 2>/dev/null || echo "")
            if [ -z "$pr_author" ] || [ "$pr_author" = "null" ]; then
              echo "::warning::Could not fetch PR author for PR #$pr_number"
            fi 
            echo "number=$pr_number" >> "$GITHUB_OUTPUT"
            echo "author=$pr_author" >> "$GITHUB_OUTPUT"
          }
          PR_NUMBER="$PR_NUMBER_PAYLOAD"
          if [ -n "$PR_NUMBER" ]; then
            echo "Found PR #$PR_NUMBER from workflow payload."
            emit_pr "$PR_NUMBER"
            exit 0
          fi
          find_match() {
            local endpoint="$1" page response count match found=""
            for page in {1..100}; do
              response=$(gh api "$endpoint&per_page=100&page=$page") || return 1
              count=$(jq 'length' <<< "$response")
              match=$(jq -r --arg head_sha "$EVENT_HEAD_SHA" --arg head_repo "$EVENT_HEAD_REPOSITORY" --arg head_branch "$EVENT_HEAD_BRANCH" '
                [.[] | select(.state == "open" and .head.sha == $head_sha and .head.repo.full_name == $head_repo and .head.ref == $head_branch) | .number] | .[]
              ' <<< "$response")
              if [ -n "$match" ]; then
                if [ -n "$found" ] || [[ "$match" == *$'\n'* ]]; then
                  return 1
                fi
                found="$match"
              fi
              if [ "$count" -lt 100 ]; then
                printf '%s' "$found"
                return 0
              fi
            done
            echo "::warning::PR lookup exceeded 100 pages" >&2
            return 1
          }
          PR_NUMBER=$(find_match "repos/$REPO/commits/$EVENT_HEAD_SHA/pulls?unused=1" 2>/dev/null || true)
          if [ -z "$PR_NUMBER" ]; then
            HEAD_OWNER="${EVENT_HEAD_REPOSITORY%%/*}"
            if [ -n "$HEAD_OWNER" ] && [ -n "$EVENT_HEAD_BRANCH" ]; then
              HEAD_FILTER=$(jq -rn --arg head "$HEAD_OWNER:$EVENT_HEAD_BRANCH" '$head | @uri')
              PR_NUMBER=$(find_match "repos/$REPO/pulls?state=open&head=$HEAD_FILTER" 2>/dev/null || true)
            fi
          fi
          if [ -n "$PR_NUMBER" ]; then
            echo "Found PR #$PR_NUMBER."
            emit_pr "$PR_NUMBER"
            exit 0
          fi
          echo "::warning::No open PR found. This workflow run might not be attached to an open PR."
          exit 0

  call-ci-failure-bot:
    needs: find-pr
    if: ${{ needs.find-pr.outputs.pr_number != '' }}
    permissions:
      contents: read
    uses: openwisp/openwisp-actions/.github/workflows/reusable-bot-ci-failure.yml@61f8fad5c4f6b9b1cf47eb396c2e1c8392aed52f # 0.1.1
    with:
      pr_number: ${{ needs.find-pr.outputs.pr_number }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      head_repo: ${{ github.event.workflow_run.head_repository.full_name }}
      base_repo: ${{ github.repository }}
      run_id: ${{ format('{0}', github.event.workflow_run.id) }}
      pr_author: ${{ needs.find-pr.outputs.pr_author }}
      actor: ${{ github.event.workflow_run.actor.login }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      APP_ID: ${{ secrets.OPENWISP_BOT_APP_ID }}
      PRIVATE_KEY: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}
