[unix_http_server]
file=/opt/openwisp/supervisor/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///opt/openwisp/supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
logfile=/dev/null
logfile_maxbytes=0
pidfile=/opt/openwisp/supervisor/supervisord.pid

[include]
files=/opt/openwisp/supervisor/conf.d/*.conf
